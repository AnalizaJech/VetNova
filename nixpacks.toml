# ============================================================
# nixpacks.toml — Configuración de build para Railway
# Coloca este archivo en la RAÍZ de tu proyecto Laravel
# ============================================================

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.intl",
  "php82Extensions.bcmath",
  "php82Extensions.tokenizer",
  "php82Extensions.ctype",
  "php82Extensions.fileinfo",
  "php82Extensions.openssl",
  "nodejs_20",
  "nodePackages.npm",
  "composer",
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build",
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan queue:work --daemon --tries=3 & php -S 0.0.0.0:$PORT -t public"
