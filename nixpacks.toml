# Configuración Nixpacks para Laravel en Railway
[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

# Las migraciones NO deben ir aquí. Se deben configurar en el 
# "Pre-Deploy Command" del panel de Railway:
# Comand: chmod +x ./railway/init-app.sh && ./railway/init-app.sh
