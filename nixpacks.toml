# Configuración Nixpacks para Laravel en Railway
[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "libmysqlclient"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
    "php artisan optimize"
]

# Las migraciones se ejecutan mediante el preDeployCommand en railway.toml
